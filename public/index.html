
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metro Paris Live</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }
    main {
      max-width: 650px;
      margin: 35px auto;
      padding: 25px;
      background: #1d293b;
      border-radius: 18px;
    }
    h1 { text-align: center; }
    p { color: #cbd5e1; }
    label {
      display: block;
      margin-top: 22px;
      margin-bottom: 8px;
      font-weight: bold;
    }
    select, button {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 0;
      font-size: 16px;
    }
    select { background: white; color: #111827; }
    button {
      margin-top: 22px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #status, #details {
      margin-top: 20px;
      padding: 14px;
      background: #101827;
      border-radius: 9px;
      line-height: 1.6;
    }
    .muted { color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>🚇 Metro Paris Live</h1>
  <p>Choisis une ligne et une station du métro parisien.</p>

  <label for="line">Ligne de métro</label>
  <select id="line" disabled>
    <option>Chargement des lignes...</option>
  </select>

  <label for="station">Station</label>
  <select id="station" disabled>
    <option>En attente...</option>
  </select>

  <button id="show" disabled>Afficher la station</button>

  <div id="status">Chargement du catalogue des stations...</div>
  <div id="details" hidden></div>
  <p class="muted">
    Les horaires en temps réel seront ajoutés après le raccordement
    des identifiants de stations à l'API PRIM.
  </p>
</main>

<script>
const lineSelect = document.getElementById("line");
const stationSelect = document.getElementById("station");
const showButton = document.getElementById("show");
const statusBox = document.getElementById("status");
const detailsBox = document.getElementById("details");

let allStops = [];

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && quoted && next === '"') {
      cell += '"';
      i++;
    } else if (char === '"') {
      quoted = !quoted;
    } else if (char === ";" && !quoted) {
      row.push(cell);
      cell = "";
    } else if ((char === "\n" || char === "\r") && !quoted) {
      if (char === "\r" && next === "\n") i++;
      row.push(cell);
      if (row.some(value => value.trim() !== "")) rows.push(row);
      row = [];
      cell = "";
    } else {
      cell += char;
    }
  }

  row.push(cell);
  if (row.some(value => value.trim() !== "")) rows.push(row);

  const headers = rows.shift().map(value => value.trim());
  return rows.map(values => {
    const item = {};
    headers.forEach((header, index) => {
      item[header] = (values[index] || "").trim();
    });
    return item;
  });
}

function cleanLine(stop) {
  let line = (stop.shortName || "").trim();

  if (!line) {
    const route = stop.route_long_name || "";
    const match = route.match(/(?:métro|metro)?\s*(\d{1,2}\s*bis|\d{1,2})/i);
    if (match) line = match[1];
  }

  return line.replace(/\s+/g, "").toLowerCase();
}

function displayLine(line) {
  return line.replace("bis", "bis");
}

function loadStations() {
  fetch("/arrets-lignes.csv")
    .then(response => {
      if (!response.ok) throw new Error("Fichier CSV introuvable");
      return response.text();
    })
    .then(text => {
      allStops = parseCSV(text).filter(stop =>
        stop.stop_name && stop.stop_id
      );

      allStops.forEach(stop => {
        stop.metroLine = cleanLine(stop);
      });

      const lines = [...new Set(
        allStops.map(stop => stop.metroLine).filter(Boolean)
      )].sort((a, b) => {
        const numberA = parseInt(a);
        const numberB = parseInt(b);
        if (numberA !== numberB) return numberA - numberB;
        return a.localeCompare(b);
      });

      lineSelect.innerHTML = '<option value="">Choisir une ligne</option>';

      lines.forEach(line => {
        const option = document.createElement("option");
        option.value = line;
        option.textContent = displayLine(line);
        lineSelect.appendChild(option);
      });

      lineSelect.disabled = false;
      statusBox.textContent =
        allStops.length + " arrêts chargés. Choisis une ligne.";
    })
    .catch(error => {
      statusBox.textContent =
        "Erreur de chargement : " + error.message +
        ". Vérifie que arrets-lignes.csv est bien dans le dossier public.";
    });
}

lineSelect.addEventListener("change", () => {
  const selectedLine = lineSelect.value;
  const stops = allStops.filter(stop => stop.metroLine === selectedLine);

  const uniqueStations = new Map();
  stops.forEach(stop => {
    const key = stop.stop_name.toLocaleLowerCase("fr");
    if (!uniqueStations.has(key)) uniqueStations.set(key, stop.stop_name);
  });

  stationSelect.innerHTML = '<option value="">Choisir une station</option>';

  [...uniqueStations.values()]
    .sort((a, b) => a.localeCompare(b, "fr"))
    .forEach(name => {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      stationSelect.appendChild(option);
    });

  stationSelect.disabled = false;
  showButton.disabled = true;
  detailsBox.hidden = true;
  statusBox.textContent = uniqueStations.size + " stations trouvées sur cette ligne.";
});

stationSelect.addEventListener("change", () => {
  showButton.disabled = !stationSelect.value;
  detailsBox.hidden = true;
});

showButton.addEventListener("click", () => {
  const name = stationSelect.value;
  const line = lineSelect.value;
  const matchingStops = allStops.filter(stop =>
    stop.metroLine === line && stop.stop_name === name
  );

  detailsBox.hidden = false;
  detailsBox.innerHTML = "";

  const title = document.createElement("h2");
  title.textContent = "Ligne " + line + " — " + name;
  detailsBox.appendChild(title);

  const info = document.createElement("p");
  info.textContent = matchingStops.length +
    " entrée(s) trouvée(s) dans le catalogue.";
  detailsBox.appendChild(info);

  matchingStops.forEach(stop => {
    const item = document.createElement("p");
    item.textContent = "Identifiant catalogue : " + stop.stop_id;
    detailsBox.appendChild(item);
  });

  const note = document.createElement("p");
  note.className = "muted";
  note.textContent =
    "Ces identifiants proviennent du catalogue des arrêts. Ils ne sont pas nécessairement les identifiants MonitoringRef nécessaires aux horaires PRIM.";
  detailsBox.appendChild(note);
});

loadStations();
</script>
</body>
</html>
